name: druid-realtime-lab
services:
  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: local_lab_only
      POSTGRES_DB: druid
    volumes:
    - metadata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U druid
      interval: 5s
      timeout: 5s
      retries: 30
  zookeeper:
    image: zookeeper:3.9.3
    environment:
      ZOO_MY_ID: '1'
    volumes:
    - zkdata:/data
    - zklog:/datalog
  kafka:
    image: apache/kafka:4.0.2
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
    - kafka:/tmp/kraft-combined-logs
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
  coordinator:
    image: apache/druid:35.0.0
    command:
    - coordinator
    env_file:
    - druid.env
    volumes:
    - coordinator:/opt/druid/var
    - shared:/opt/shared
    - ./data:/opt/lab/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    ports:
    - 127.0.0.1:8081:8081
  broker:
    image: apache/druid:35.0.0
    command:
    - broker
    env_file:
    - druid.env
    volumes:
    - broker:/opt/druid/var
    - shared:/opt/shared
    - ./data:/opt/lab/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    ports:
    - 127.0.0.1:8082:8082
  historical:
    image: apache/druid:35.0.0
    command:
    - historical
    env_file:
    - druid.env
    volumes:
    - historical:/opt/druid/var
    - shared:/opt/shared
    - ./data:/opt/lab/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    ports:
    - 127.0.0.1:8083:8083
  middlemanager:
    image: apache/druid:35.0.0
    command:
    - middleManager
    env_file:
    - druid.env
    volumes:
    - middlemanager:/opt/druid/var
    - shared:/opt/shared
    - ./data:/opt/lab/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    ports:
    - 127.0.0.1:8091:8091
  router:
    image: apache/druid:35.0.0
    command:
    - router
    env_file:
    - druid.env
    volumes:
    - router:/opt/druid/var
    - shared:/opt/shared
    - ./data:/opt/lab/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_started
    ports:
    - 127.0.0.1:8888:8888
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles:
    - monitoring
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9090:9090
    extra_hosts:
    - host.docker.internal:host-gateway
  flink-jobmanager:
    image: druid-lab-flink:1.20.1
    build:
      context: .
      dockerfile: flink/Dockerfile
    profiles:
    - flink
    command: jobmanager
    environment:
      FLINK_PROPERTIES: 'jobmanager.rpc.address: flink-jobmanager

        rest.bind-address: 0.0.0.0

        jobmanager.memory.process.size: 1024m

        taskmanager.memory.process.size: 2048m

        taskmanager.numberOfTaskSlots: 2

        parallelism.default: 1

        state.backend.type: hashmap

        state.checkpoints.dir: file:///opt/flink/state/checkpoints

        state.savepoints.dir: file:///opt/flink/state/savepoints

        restart-strategy.type: fixed-delay

        restart-strategy.fixed-delay.attempts: 10

        restart-strategy.fixed-delay.delay: 10s

        python.executable: /opt/pyflink/bin/python

        python.client.executable: /opt/pyflink/bin/python

        '
      DEDUP_TTL_SECONDS: '86400'
      TX_PREFIX: druid-lab-v2
    volumes:
    - flink-state:/opt/flink/state
    ports:
    - 127.0.0.1:8084:8081
    depends_on:
      kafka:
        condition: service_healthy
  flink-taskmanager:
    image: druid-lab-flink:1.20.1
    build:
      context: .
      dockerfile: flink/Dockerfile
    profiles:
    - flink
    command: taskmanager
    environment:
      FLINK_PROPERTIES: 'jobmanager.rpc.address: flink-jobmanager

        rest.bind-address: 0.0.0.0

        jobmanager.memory.process.size: 1024m

        taskmanager.memory.process.size: 2048m

        taskmanager.numberOfTaskSlots: 2

        parallelism.default: 1

        state.backend.type: hashmap

        state.checkpoints.dir: file:///opt/flink/state/checkpoints

        state.savepoints.dir: file:///opt/flink/state/savepoints

        restart-strategy.type: fixed-delay

        restart-strategy.fixed-delay.attempts: 10

        restart-strategy.fixed-delay.delay: 10s

        python.executable: /opt/pyflink/bin/python

        python.client.executable: /opt/pyflink/bin/python

        '
      DEDUP_TTL_SECONDS: '86400'
      TX_PREFIX: druid-lab-v2
    volumes:
    - flink-state:/opt/flink/state
    depends_on:
      flink-jobmanager:
        condition: service_started
  flink-client:
    image: druid-lab-flink:1.20.1
    build:
      context: .
      dockerfile: flink/Dockerfile
    profiles:
    - flink-tools
    command: help
    environment:
      FLINK_PROPERTIES: 'jobmanager.rpc.address: flink-jobmanager

        rest.bind-address: 0.0.0.0

        jobmanager.memory.process.size: 1024m

        taskmanager.memory.process.size: 2048m

        taskmanager.numberOfTaskSlots: 2

        parallelism.default: 1

        state.backend.type: hashmap

        state.checkpoints.dir: file:///opt/flink/state/checkpoints

        state.savepoints.dir: file:///opt/flink/state/savepoints

        restart-strategy.type: fixed-delay

        restart-strategy.fixed-delay.attempts: 10

        restart-strategy.fixed-delay.delay: 10s

        python.executable: /opt/pyflink/bin/python

        python.client.executable: /opt/pyflink/bin/python

        '
      DEDUP_TTL_SECONDS: '86400'
      TX_PREFIX: druid-lab-v2
    volumes:
    - flink-state:/opt/flink/state
    depends_on:
      flink-jobmanager:
        condition: service_started
volumes:
  metadata: {}
  zkdata: {}
  zklog: {}
  kafka: {}
  shared: {}
  coordinator: {}
  broker: {}
  historical: {}
  middlemanager: {}
  router: {}
  flink-state: {}
